[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inspect-swe-reminder-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["inspect-ai", "inspect-swe"]

[project.entry-points.inspect_ai]
inspect_swe_reminder_agent = "inspect_swe_reminder_agent"

[tool.pytest.ini_options]
pythonpath = ["src"]

